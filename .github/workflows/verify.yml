name: verify

on:
  push:
    branches: [main]
  pull_request:

# `pnpm verify` is the definition of done, so CI runs exactly that - it builds,
# typechecks, lints, runs the unit and type tests, produces fresh evidence with
# Playwright, and then evaluates the ten gates. Any one of them failing fails
# the build; that includes the ESLint rule that rejects a hex, px or rgb()
# literal outside packages/tokens.
#
# That includes visual regression: Linux baselines are committed alongside the
# Windows ones, generated by the `baselines` workflow on this same image, so
# the comparison is against a baseline nobody wrote during the run.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify
        run: pnpm verify

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          # .verify is a dot-directory, which this action treats as hidden and
          # skips unless told otherwise.
          include-hidden-files: true
          path: |
            .verify/*.json
            .verify/shots
            .verify/attestation.pdf
          retention-days: 14
